name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'cursor/**'
    paths:
      # App 加载的是远程网页（capacitor.config.json 的 server.url），
      # 前端/后端代码改动不需要重新打包 APK。只有下面这些原生层相关
      # 的文件变了，才需要重新触发构建。
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'scripts/**'
      - 'www/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'scripts/**'
      - 'www/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --iconBackgroundColor '#FAF6F1' --iconBackgroundColorDark '#FAF6F1' --android
          else
            echo "assets/icon.png not found, skipping icon generation (using Capacitor default)"
          fi

      - name: Apply native patches
        run: bash scripts/apply-patches.sh

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elpis-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
