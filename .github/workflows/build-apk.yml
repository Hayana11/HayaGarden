name: Build Canary APK

on:
  push:
    branches:
      - claude/app-shell-reset-pure
      - 'claude/app-shell-reset-pure/**'
      - claude/app-shell-reset-p1-navigation
      - 'claude/app-shell-reset-p1-navigation/**'
      - claude/app-shell-p2a-nativebridge-lite
      - 'claude/app-shell-p2a-nativebridge-lite/**'
      - claude/app-shell-p2b-native-notifications
      - 'claude/app-shell-p2b-native-notifications/**'
      - claude/p2b1-notification-icon-polish
      - agent/p2c1-physical-reality-sensors
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - claude/app-shell-reset-p1-navigation
      - claude/app-shell-p2a-nativebridge-lite

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps
        run: npm ci

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject AGConnect config when configured
        env:
          AGCONNECT_SERVICES_JSON_B64: ${{ secrets.AGCONNECT_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$AGCONNECT_SERVICES_JSON_B64" ]; then
            echo "AGCONNECT_SERVICES_JSON_B64 is not configured; HMS runtime will remain unavailable until configured"
            exit 0
          fi
          printf '%s' "$AGCONNECT_SERVICES_JSON_B64" | base64 --decode > android/app/agconnect-services.json
          chmod 600 android/app/agconnect-services.json
          python3 -m json.tool android/app/agconnect-services.json >/dev/null

      - name: Apply P2C.1 Physical + HMS Activity
        run: bash scripts/apply-p2c1-physical.sh

      - name: Apply Health Bridge R1
        run: bash scripts/apply-health-r1.sh

      - name: Health Bridge R1 contract test
        run: bash scripts/test-health-r1.sh

      - name: P2B contract test
        run: bash scripts/test-p2b-native-notifications.sh

      - name: P2C.1 contract test
        run: bash scripts/test-p2c1-physical.sh

      - name: HMS Activity R1 contract test
        run: bash scripts/test-hms-activity-r1.sh

      - name: Generate app icons
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --iconBackgroundColor '#FAF6F1' --iconBackgroundColorDark '#FAF6F1' --android || echo "icon generation skipped"
          else
            echo "assets/icon.png not found, using Capacitor default icons"
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elpis-Canary-health-r1-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
